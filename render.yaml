services:
  - type: web
    name: infectious-diseases-mapping
    env: python
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "infectious-diseases-mapping.onrender.com"
      - key: DEBUG
        value: "False"
